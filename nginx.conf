# Nginx Configuration for SPAK Metaal Craft
# Copy to /etc/nginx/sites-available/spakmetaalcraft and symlink to sites-enabled
# Test: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name spakmetaalcraft.com www.spakmetaalcraft.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name spakmetaalcraft.com www.spakmetaalcraft.com;

    root /var/www/spakmetaalcraft;
    index index.html;

    # SSL Configuration (use Let's Encrypt certificates)
    ssl_certificate /etc/letsencrypt/live/spakmetaalcraft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spakmetaalcraft.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/spakmetaalcraft.com/chain.pem;

    # Modern SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Brotli Compression (requires ngx_brotli module)
    # brotli on;
    # brotli_vary on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static Asset Caching (1 year for versioned assets)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML: Short cache with revalidation
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Security: Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Block access to backup/config files
    location ~* \.(bak|backup|conf|config|log|sql|md|gitignore|gitattributes)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Main location - serve static files
    location / {
        try_files $uri $uri/ =404;
    }

    # Custom 404 page (optional)
    # error_page 404 /404.html;

    # Rate limiting for API/contact forms (if added later)
    # limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # location /api/ { limit_req zone=api burst=20 nodelay; }

    # Logging
    access_log /var/log/nginx/spakmetaalcraft_access.log;
    error_log /var/log/nginx/spakmetaalcraft_error.log;
}